# dsh-status-anim 发布流水线（npm OIDC Trusted Publisher + provenance）
#
# 为什么只有 push tag 触发（AGENTS.md 第 7 条）：
#   版本一致性校验步骤带 `if: startsWith(github.ref, 'refs/tags/')`，只有 tag 触发时该条件才成立。
#   若开手动触发，该步骤会被整段跳过，等于零校验把 package.json#version 直接发出去，
#   而 npm 已发布版本不可删不可覆盖，发错只能发下一版补救。所以触发方式只有 tags: ['dsh-v*']。
#
# 为什么 checkout 必须显式带 ref: ${{ github.ref }}（AGENTS.md 第 4 条）：
#   不带 ref 时 actions/checkout 在 tag 事件上取的是 tag 指向的 commit，看起来一样，
#   但一旦 tag 与远程 HEAD 脱节（tag 早打完又补了提交），打出来的包就缺改动，CI 依然 success —— 发布残缺且不可修复。
#   显式钉住 github.ref 表达「就发这个 tag 指向的 commit」，配合发版流程里「先 push 再核远程 HEAD 后打 tag」形成双保险。
#
# 为什么两个 Action 都用 @v7：actions/checkout v7 是当前主版本（最新 v7.0.1，浮动 tag refs/tags/v7 已验证存在）；
#   actions/setup-node v7 同理（最新 v7.1.0）。setup-node v4–v6 存在「写入假 token 污染 .npmrc」的缺陷，
#   会干扰 OIDC / Trusted Publisher 认证，因此不用 @v4/@v5/@v6。
#
# 为什么不再注入任何 npm 认证 token（曾通过 env 传入仓库 secret）：
#   npm 判定认证状态看的是 .npmrc 里是否存在 `_authToken` 这一行，而不是它的值。
#   只要该行存在（setup-node 的 registry-url 也会写入一行占位 token），npm 就认为「已经有凭证」，
#   于是跳过 OIDC 的 token exchange，直接拿这个空/假 token 去请求 registry，结果是 ENEEDAUTH / E404 / 401，
#   而报错信息完全看不出「OIDC 被抑制」这个真实原因。本仓库 secrets 实测为空，那个 env 只会把发布打成 401。
#   正确做法：不注入任何 token，并在 publish 前把 .npmrc 的 authToken 行删掉（保留 registry 行）。
#
# 为什么无条件升级 npm（而不是「低于 11.5.1 才升级」）：
#   OIDC Trusted Publisher 需要 npm >= 11.5.1，而 Node 24.0.0 自带的是 npm 11.0.0
#   （见 https://nodejs.org/en/blog/release/v24.0.0 ），天然不达标。
#   更糟的是版本不足时的报错会被伪装成 404 / ENEEDAUTH，排查成本极高。
#   所以这里不再做条件判断，一律升级到 latest 并打印实际版本，把不确定性一次性消掉。

name: publish

on:
  push:
    tags: ['dsh-v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC（npm Trusted Publisher）必需：供 npm 换取短期发布凭证
      id-token: write
    steps:
      - name: checkout（钉住触发本次运行的 tag commit）
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: setup-node（Node 24 + npm registry）
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 升级 npm 到 latest（OIDC Trusted Publisher 需 npm >= 11.5.1）
        shell: bash
        # 无条件升级：Node 24.0.0 只带 npm 11.0.0，低于 11.5.1；
        # 版本不足的报错会被伪装成 404 / ENEEDAUTH，极难排查，所以不做条件判断。
        run: |
          set -euo pipefail
          echo "升级前 npm 版本：$(npm -v)"
          npm install -g npm@latest
          echo "升级后 npm 版本：$(npm -v)"

      - name: 版本一致性校验（tag 版本 == package.json version）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#dsh-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag 版本：${TAG_VERSION}"
          echo "package.json 版本：${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag 版本 ${TAG_VERSION} 与 package.json 版本 ${PKG_VERSION} 不一致，终止发布"
            exit 1
          fi
          echo "VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"
          echo "版本校验通过：${PKG_VERSION}"

      - name: 安装依赖（无外部依赖，锁文件只含根条目）
        shell: bash
        # --no-audit --no-fund 只影响输出噪音；本项目无 dependencies/devDependencies，
        # peer @deepseek-ai/cordis 为 optional，npm ci 只校验 package-lock.json 与 package.json 是否同步。
        run: npm ci --no-audit --no-fund

      - name: 发布门禁（AGENTS.md 第 8 条统一入口）
        shell: bash
        run: npm run check:release

      - name: 清除 setup-node 写入的占位 authToken（否则 npm 会跳过 OIDC）
        shell: bash
        # registry-url 会写入占位 `_authToken`，存在即抑制 OIDC；必须删掉 token 行但**保留 registry 行**。
        run: |
          set -euo pipefail
          npm config delete //registry.npmjs.org/:_authToken
          echo "剩余 .npmrc 认证相关配置（应无 _authToken）："
          npm config list

      - name: 发布到 npm（provenance + OIDC）
        shell: bash
        # 不注入任何认证 token：.npmrc 中存在 `_authToken` 行会让 npm 跳过 OIDC exchange。
        # 配好 Trusted Publisher 后 provenance 会自动生成，`--provenance` 可省（保留无害）；
        # `--access public` 是首发公开包所必需的。
        run: npm publish --provenance --access public

      - name: 发布后核验（registry 上的版本与 tarball）
        shell: bash
        # npm publish 成功后 registry 索引并非立即可查（本仓库实测延迟 4 分 8 秒），
        # 直接查一次会把传播延迟误报成失败。这里改为轮询：20 次 × 15 秒 ≈ 300 秒上限。
        # 实测延迟 248 秒，故上限设为 300 秒（旧值 180 秒小于实测延迟，仍会误报）。
        # 注意 `2>/dev/null || true`：set -e 下 npm view 的 E404 必须被吞掉，否则脚本直接中断。
        # 缓存策略选 --prefer-online（而非每轮 npm cache clean --force）：每个 npm view 都强制向
        # registry 重新校验，既不读陈旧缓存，也不用反复清空整个缓存目录（清缓存对每轮都生效但开销大且会拖慢后续查询）。
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          echo "核验 ${PKG_NAME}@${VERSION}"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          PUBLISHED_VERSION=""
          for i in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "等待 registry 传播 ($i/${MAX_ATTEMPTS})..."
            PUBLISHED_VERSION="$(npm view "${PKG_NAME}@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "${PUBLISHED_VERSION}" = "${VERSION}" ]; then
              echo "registry 已可查到 ${PKG_NAME}@${VERSION}（第 ${i} 轮）"
              break
            fi
            if [ "${i}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep "${SLEEP_SECONDS}"
            fi
          done
          echo "registry version: ${PUBLISHED_VERSION:-<空>}"
          if [ "${PUBLISHED_VERSION}" != "${VERSION}" ]; then
            echo "::error::registry 上未找到 ${PKG_NAME}@${VERSION}（已等待 180 秒）"
            exit 1
          fi
          echo "registry dist.tarball: $(npm view "${PKG_NAME}@${VERSION}" dist.tarball --prefer-online 2>/dev/null || true)"
